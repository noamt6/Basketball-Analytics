# Publish the dashboard + push the batch image. Does NOT run migrate/ingest —
# data refreshes are a separate deliberate step (locally or `aws ecs run-task`).
#
# MANUAL ONLY (workflow_dispatch). The GitHub OIDC deploy path is not
# provisioned for this repo — there is no OIDC provider / deploy role in AWS
# and none of the secrets/vars below are set, so an automatic run on every
# push just fails at "configure-aws-credentials". Day-to-day deploys are done
# with the local `aws` CLI. To re-enable auto-deploy: `terraform apply` with
# `github_repo` set, then add these repo settings and restore the `push` trigger:
#   secret  AWS_DEPLOY_ROLE_ARN        -> github_deploy_role_arn
#   var     AWS_REGION                 -> eu-central-1
#   var     ECR_REPOSITORY_URL         -> ecr_repository_url
#   var     SITE_BUCKET                -> site_bucket
#   var     CLOUDFRONT_DISTRIBUTION_ID -> cloudfront_distribution_id
name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push batch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:latest
            ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

      # dashboard.html + data.json + games/ (per-file Cache-Control) + CloudFront
      # invalidation -- the same script as a local deploy (scripts/publish_site.sh)
      - name: Publish dashboard
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash scripts/publish_site.sh
