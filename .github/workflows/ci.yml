name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile db_client.py ingest.py metrics.py test_analytics.py export_dashboard_data.py
      - name: Data-quality audit (impossible rows only)
        run: python scripts/check_data_quality.py --fail-on fg

  dashboard-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: scripts
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Responsive / RTL sweep
        run: node scripts/qa_responsive_rtl.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build batch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bball-batch:ci
