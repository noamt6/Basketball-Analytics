<script>
  (function () {
    try {
      var lang = localStorage.getItem('sls-lang') || 'he';
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
      document.documentElement.setAttribute('data-lang', lang);
    } catch (e) {}
    // JS-measured mobile breakpoint, redundant with the CSS @media(max-width:640px)
    // block but authoritative when the two disagree -- see the CSS comment
    // next to the html[data-mobile] rules for why they can disagree (page
    // rendered inside an <iframe>, where a <meta viewport> tag is ignored).
    function syncMobileAttr() {
      if (window.innerWidth <= 640) document.documentElement.setAttribute('data-mobile', '');
      else document.documentElement.removeAttribute('data-mobile');
    }
    syncMobileAttr();
    window.addEventListener('resize', syncMobileAttr);
  })();
</script>

<style>
  :root {
    color-scheme: dark;
    --bg: #0A0E13;
    --panel: #11161D;
    --panel-2: #151b23;
    --hair: rgba(255,255,255,.08);
    --hair-soft: rgba(255,255,255,.05);
    --hair-strong: rgba(255,255,255,.14);
    --ink: #ffffff;
    --ink-2: rgba(255,255,255,.65);
    --ink-3: rgba(255,255,255,.45);
    --ink-4: rgba(255,255,255,.28);
    --track: rgba(255,255,255,.09);
    --accent: #D8492E;
    --accent-rgb: 216,73,46;
    --accent-hover: #f0664a;
    --accent-wash: rgba(216,73,46,.10);
    --accent-ring: rgba(216,73,46,.32);
    --font-display: 'Anton', 'Archivo Black', sans-serif;
    --font-body: 'Archivo', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display-he: 'Rubik', 'Segoe UI', sans-serif;
    --font-body-he: 'Rubik', system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-lang="he"] {
    --font-display: var(--font-display-he);
    --font-body: var(--font-body-he);
  }

  * { box-sizing: border-box; }
  /* `clip`, not `hidden`: clipping horizontal bleed without turning <body>
     into a scroll container -- `overflow-x: hidden` forces `overflow-y` to
     compute to `auto`, which breaks `position: sticky` on the topbar. */
  html, body { background: var(--bg); overflow-x: clip; max-width: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); }
  ::selection { background: var(--accent-wash); }
  button { font-family: inherit; }

  .shell { min-height: 100vh; background: var(--bg); padding-bottom: 64px; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 0 40px; height: 64px; border-bottom: 1px solid var(--hair);
    background: var(--bg); position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 0; }
  .brand-logo { width: 30px; height: 30px; display: block; flex: none; }
  .brand-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .brand-name {
    font: 400 19px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .brand-tagline {
    font: 500 9.5px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 860px) { .brand-tagline { display: none; } }
  /* thin divider between the grouped left-zone controls */
  .ctl-sep { width: 1px; height: 20px; background: var(--hair-strong); flex: none; }
  /* ---------- Season selector ---------- */
  .season-picker { position: relative; display: inline-flex; align-items: center; flex: none; }
  .season-picker-ico {
    position: absolute; inset-inline-start: 9px; top: 50%; transform: translateY(-50%);
    font-size: 12px; line-height: 1; pointer-events: none; opacity: .8;
  }
  .season-picker select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    font: 600 11.5px/1 var(--font-body); letter-spacing: .04em;
    color: var(--ink-2); background: rgba(255,255,255,.06);
    border: 1px solid var(--hair); border-radius: 6px;
    padding: 6px 26px 6px 26px; cursor: pointer;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .season-picker select:hover { color: var(--ink); border-color: var(--ink-4); background: rgba(255,255,255,.1); }
  .season-picker select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  /* custom chevron */
  .season-picker::after {
    content: ""; position: absolute; inset-inline-end: 10px; top: 50%;
    width: 7px; height: 7px; margin-top: -5px; pointer-events: none;
    border-inline-end: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
    transform: rotate(45deg);
  }
  .season-picker select option { background: var(--bg); color: var(--ink); }
  nav.tabs { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  nav.tabs button {
    padding: 8px 15px; border: 0; border-radius: 6px; cursor: pointer;
    font: 600 11.5px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
    background: transparent; color: var(--ink-3);
    box-shadow: inset 0 0 0 0 var(--accent);
    transition: background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  nav.tabs button:hover { color: var(--ink-2); background: rgba(255,255,255,.06); }
  /* active tab: quiet pill + a thin accent underline, no heavy fill */
  nav.tabs button[aria-current="true"] {
    background: rgba(255,255,255,.07); color: var(--ink);
    box-shadow: inset 0 -2px 0 0 var(--accent);
  }
  nav.tabs button[aria-current="true"]:hover { background: rgba(255,255,255,.1); color: var(--ink); }
  .flag-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display: block; }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex: 1 1 0; justify-content: flex-end; }
  .lang-switch {
    display: flex; align-items: center; gap: 2px; padding: 2px; flex: none;
    border: 1px solid var(--hair-strong); border-radius: 4px;
  }
  .lang-switch button {
    padding: 5px 10px; border: 0; border-radius: 2px; cursor: pointer;
    font: 600 11px/1 var(--font-body); background: transparent; color: var(--ink-3); transition: background .12s ease, color .12s ease;
  }
  .lang-switch button:hover { color: var(--ink-2); }
  .lang-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  /* header segmented controls: subtle dark, no accent fill */
  .topbar-right .lang-switch {
    background: rgba(255,255,255,.06); border-color: var(--hair); border-radius: 6px; padding: 3px;
  }
  .topbar-right .lang-switch button { border-radius: 4px; }
  .topbar-right .lang-switch button[aria-pressed="true"] { background: rgba(255,255,255,.14); color: var(--ink); }
  .lang-switch button:disabled {
    opacity: .38; cursor: not-allowed; color: var(--ink-4);
    background: transparent;
  }
  .lang-switch button:disabled:hover { color: var(--ink-4); }

  .view { padding: 44px 40px 56px; max-width: 1360px; margin: 0 auto; }

  /* ---------- Hero ---------- */
  .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-bottom: 34px; flex-wrap: wrap; }
  .eyebrow {
    font: 600 10px/1 var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 14px;
  }
  .display-xl {
    font: 400 clamp(34px, 5.5vw + 14px, 68px)/.9 var(--font-display); text-transform: uppercase; letter-spacing: -.02em; text-wrap: balance;
  }
  .display-outline { color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.5); }
  .stat-row { display: flex; gap: 44px; padding-bottom: 8px; flex-wrap: wrap; }
  .stat-row .num { font: 400 44px/1 var(--font-display); }
  .stat-row .lbl { margin-top: 6px; font: 600 9.5px/1 var(--font-body); letter-spacing: .17em; text-transform: uppercase; color: var(--ink-3); }

  /* ---------- Panels ---------- */
  .panel { background: var(--panel); border: 1px solid var(--hair); }
  .panel-head { padding: 24px 28px 18px; border-bottom: 1px solid var(--hair); }
  .panel-kicker { font: 600 10px/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
  .panel-title { font: 400 30px/1 var(--font-display); text-transform: uppercase; }
  .panel-title.sm { font-size: 26px; }

  /* ---------- Overview grid ---------- */
  .ov-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 980px) { .ov-grid { grid-template-columns: 1fr; } }
  .team-bars { padding: 18px 28px 26px; display: flex; flex-direction: column; gap: 1px; }
  .team-bar-row {
    display: grid; grid-template-columns: 26px 1fr 190px 54px; align-items: center; gap: 14px;
    padding: 7px 4px; border-radius: 4px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: inherit;
    font-family: inherit; color: inherit;
  }
  .team-bar-row:hover, .team-bar-row:focus-visible { background: rgba(255,255,255,.05); outline: none; }
  .team-bar-row .rk { font: 500 11px/1 var(--font-body); color: var(--ink-4); text-align: right; }
  .team-bar-row .nm { font: 500 13px/1.2 var(--font-body); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team-bar-row .tr { height: 9px; background: var(--track); display: block; }
  .team-bar-row .fl { display: block; height: 100%; }
  .team-bar-row .vl { text-align: right; font: 600 14px/1 var(--font-body); }

  .leaders-list { padding: 24px 28px 28px; display: flex; flex-direction: column; }
  .leader-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0;
    border-bottom: 1px solid var(--hair-soft); cursor: pointer; background: transparent; border-left: 0; border-right: 0; border-top: 0;
    width: 100%; text-align: inherit; font-family: inherit; color: inherit;
  }
  .leader-row:last-child { border-bottom: none; }
  .leader-row:hover .leader-name, .leader-row:focus-visible .leader-name { color: var(--accent); }
  .leader-name { font: 600 14px/1.2 var(--font-body); transition: color .12s ease; }
  .leader-meta { margin-top: 5px; font: 400 11px/1 var(--font-body); color: var(--ink-3); }
  .leader-val { font: 400 30px/1 var(--font-display); }
  .leader-val.hi { color: var(--accent); }

  /* ---------- Home: league-leader cards ---------- */
  .leaders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .leader-card { background: var(--panel); border: 1px solid var(--hair); padding: 18px 20px 12px; display: flex; flex-direction: column; }
  .leader-card-cat { font: 600 10px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
  .leader-card-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%;
    background: transparent; border: 0; padding: 0 0 14px; text-align: inherit; font-family: inherit; color: inherit; cursor: pointer;
  }
  .leader-card-top:hover .lc-name, .leader-card-top:focus-visible .lc-name { color: var(--accent); }
  .leader-card-top:focus-visible { outline: none; }
  .lc-who { min-width: 0; }
  .lc-name { font: 600 14px/1.25 var(--font-body); transition: color .12s ease; }
  .lc-meta { margin-top: 5px; font: 400 11px/1.3 var(--font-body); color: var(--ink-3); }
  .lc-val { font: 400 30px/1 var(--font-display); color: var(--accent); flex: none; font-variant-numeric: tabular-nums; }
  .leader-card-rest { display: flex; flex-direction: column; }
  .lc-row {
    display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; padding: 8px 0;
    border-top: 1px solid var(--hair-soft); background: transparent; border-left: 0; border-right: 0; border-bottom: 0;
    width: 100%; text-align: inherit; font-family: inherit; color: inherit; cursor: pointer;
  }
  .lc-row:hover .lc-rn, .lc-row:focus-visible .lc-rn { color: var(--accent); }
  .lc-row:focus-visible { outline: none; }
  .lc-rk { font: 400 12px/1 var(--font-display); color: var(--ink-4); }
  .lc-rn { font: 500 12.5px/1.3 var(--font-body); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .12s ease; }
  .lc-rv { font: 600 12.5px/1 var(--font-body); color: var(--ink); font-variant-numeric: tabular-nums; }

  .dq-card { padding: 24px 28px 28px; }
  .dq-head { display: flex; align-items: center; gap: 9px; margin-bottom: 16px; }
  .dq-head .flag-dot { width: 6px; height: 6px; }
  .dq-head span.lbl { font: 600 10px/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .dq-title { font: 400 22px/1.3 var(--font-display); text-transform: uppercase; margin-bottom: 12px; }
  .dq-body { font: 400 12.5px/1.6 var(--font-body); color: var(--ink-3); }
  .dq-link { display: inline-block; margin-top: 18px; font: 600 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; border: 0; background: none; padding: 0; }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  .grid-table { width: 100%; border-collapse: collapse; min-width: 680px; }
  .grid-head {
    display: grid; gap: 0; padding: 0 36px; border-bottom: 1px solid var(--hair-strong); height: 50px; align-items: center;
    font: 600 9.5px/1 var(--font-body); letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3);
  }
  .grid-row {
    display: grid; gap: 0; padding: 0 36px; height: 58px; align-items: center; border-bottom: 1px solid var(--hair-soft);
    background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: inherit; font-family: inherit; color: inherit; cursor: pointer;
  }
  .grid-row:hover, .grid-row:focus-visible { background: rgba(255,255,255,.035); outline: none; }
  .grid-row:last-child { border-bottom: none; }
  .cell-right { text-align: right; }
  .rank-num { font: 400 20px/1 var(--font-display); color: var(--ink-4); }
  .rank-num.sm { font-size: 17px; }
  .team-name-cell { font: 600 14px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-name-cell { font: 600 13.5px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
  .stat-strong { font: 600 14.5px/1 var(--font-body); }
  .stat-strong.sm { font-size: 14px; }
  .stat-soft { font: 400 14.5px/1 var(--font-body); color: var(--ink-2); }
  .stat-soft.sm { font-size: 13.5px; }
  /* PIR reads at the same size/weight as every other metric number in the row
     -- it is not enlarged or set in the display face. */
  .pir-cell { font: 600 14.5px/1 var(--font-body); }
  .pir-cell.sm { font-size: 14px; }
  .pos-cell { font: 500 11px/1 var(--font-body); color: var(--ink-3); }
  .row-flag { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

  .league-cols { grid-template-columns: 48px 1fr repeat(6, 94px); }
  .roster-cols { grid-template-columns: 48px 1fr 46px 64px 70px 60px repeat(3, 72px) 78px; }
  .players-cols { grid-template-columns: minmax(150px, 1.6fr) minmax(96px, 1fr) 50px 46px 48px 60px repeat(4, 60px) repeat(3, 54px); }

  .team-note {
    padding: 14px 28px; border-top: 1px solid var(--hair); font: 400 12px/1.6 var(--font-body); color: var(--ink-3);
  }

  /* ---------- Key Insights card ---------- */
  .insights-list { padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 13px; }
  .insight-item {
    position: relative; padding-inline-start: 20px;
    font: 400 13.5px/1.55 var(--font-body); color: var(--ink-2);
  }
  .insight-item::before {
    content: ""; position: absolute; inset-inline-start: 2px; top: 8px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  html[data-mobile] .insights-list { padding: 18px 16px 20px; }

  /* ---------- Team hero ---------- */
  .team-hero {
    position: relative; padding: 36px 40px 32px; overflow: hidden; margin-bottom: 24px;
  }
  .ring { position: absolute; border-radius: 50%; pointer-events: none; }
  .ring-accent { right: -150px; top: -150px; width: 460px; height: 460px; border: 1px solid rgba(216,73,46,.3); }
  .ring-soft { right: -210px; top: -90px; width: 340px; height: 340px; border: 1px solid rgba(255,255,255,.08); }
  .edge-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent); }
  .team-hero-inner { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
  .team-hero-title { font: 400 clamp(32px, 6.8vw + 8px, 74px)/.88 var(--font-display); text-transform: uppercase; letter-spacing: -.015em; }
  .team-quad { display: grid; grid-template-columns: repeat(3, auto); gap: 36px 44px; padding-bottom: 6px; text-align: right; }
  .team-quad .num { font: 400 40px/1 var(--font-display); }
  .team-quad .num.hi { color: var(--accent); }
  .team-quad .lbl { margin-top: 6px; font: 600 9.5px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

  /* ---------- Player hero ---------- */
  .player-hero { position: relative; padding: 36px 40px 30px; overflow: hidden; }
  .player-hero-inner { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; flex-wrap: wrap; }
  .player-name { font: 400 clamp(36px, 7.7vw + 8px, 84px)/.86 var(--font-display); text-transform: uppercase; letter-spacing: -.015em; text-wrap: balance; }
  .rank-badge { flex: none; text-align: right; }
  .rank-badge .big { font: 400 clamp(48px, 7.7vw + 20px, 96px)/1 var(--font-display); color: var(--accent); letter-spacing: -.04em; }
  .rank-badge .lbl { font: 600 10px/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
  .player-pos {
    display: inline-block; margin-top: 18px; padding: 7px 13px;
    border: 1px solid var(--accent-ring); border-radius: 3px;
    font: 600 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
  }

  .quad4 { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--hair); }
  .quad4 > div { padding-block: 24px 26px; padding-inline: 40px 0; border-inline-end: 1px solid var(--hair); }
  .quad4 > div:last-child { border-inline-end: 0; }
  .quad4 .num { font: 400 58px/1 var(--font-display); }
  .quad4 .num.hi { color: var(--accent); }
  .quad4 .lbl { margin-top: 8px; font: 600 10px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

  .player-lower { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 28px 40px 34px; border-top: 1px solid var(--hair); }
  @media (max-width: 780px) { .player-lower { grid-template-columns: 1fr; } }

// Shape: { default_season, seasons: { <season>: { teams, players, by_position, transfers, bad_split_count, player_count, playoffs } } }.
let DATA;   // the active season's blob (RAW.seasons[state.season])
let RAW;    // the whole data.json: { default_season, seasons: { <season>: blob } }
/* ---------------- i18n ---------------- */
/* Only five real position slots. The source also carries hybrid codes
   (G, F, G-F, F-C); `posGroups` collapses each to one or two of the five,
   primary first, so the filter offers just PG/SG/SF/PF/C and a "plays both"
   player shows up under either. English spells the slot out; Hebrew keeps the
   code -- the convention Israeli basketball media follows. */
const POSITION_NAME = {
  PG: 'Point guard', SG: 'Shooting guard', SF: 'Small forward', PF: 'Power forward', C: 'Center',
};
const POS_SLOTS = ['PG', 'SG', 'SF', 'PF', 'C'];
const POS_MAP = {
  PG: ['PG'], SG: ['SG'], SF: ['SF'], PF: ['PF'], C: ['C'],
  G: ['PG', 'SG'], F: ['SF', 'PF'], 'G-F': ['SG', 'SF'], 'F-C': ['PF', 'C'],
};
function posGroups(code) { return POS_MAP[code] || (code ? [code] : []); }
function posLabel(code) { return posGroups(code).join('/') || '—'; }

const STR = {

/* ---------------- utilities ---------------- */
function fmt(n, d) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return Number(n).toFixed(d === undefined ? 1 : d);
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/** Percentile rank (0-1) of `value` within `pool`, ties sharing the middle of
 * their tied band. `invert` flips it for "lower is better" stats (turnovers). */
function percentileOf(value, pool, invert) {
  if (!pool.length) return 0;
  const below = pool.filter((v) => v < value).length;
  const equal = pool.filter((v) => v === value).length;
  let p = pool.length > 1 ? (below + equal / 2) / pool.length : 1;
  if (invert) p = 1 - p;
  return Math.max(0, Math.min(1, p));
}
/** Background wash for a percentile-tinted table cell. Diverging + high
 * contrast so the top / middle / bottom of the league read apart at a glance:
 * the upper half ramps hard into the accent (up to ~0.66 alpha, gamma-curved
 * so leaders pop), the lower half gets a cool desaturated wash, the middle
 * stays near-clear. Text keeps its own ink color. */
function percentileBg(value, pool, invert) {
  const p = percentileOf(value, pool, invert);
  if (p >= 0.5) {
    const k = (p - 0.5) / 0.5;                 // 0..1 across the top half
    return `rgba(var(--accent-rgb), ${(0.05 + Math.pow(k, 1.35) * 0.61).toFixed(3)})`;
  }
  const k = (0.5 - p) / 0.5;                   // 0..1 across the bottom half
  return `rgba(96, 122, 158, ${(Math.pow(k, 1.5) * 0.30).toFixed(3)})`;

/* ---------------- Key Insights (rule-based) ---------------- *
 * 2-4 concrete, data-backed bullets per player / team, scored by priority and
 * cut to the strongest few. Every threshold is a percentile within the ACTIVE
 * season's pool, so the read re-bases automatically when the season changes. */
function _pctl(value, pool, invert) {
  return Math.max(1, Math.min(99, Math.round(percentileOf(value, pool, invert) * 100)));
}

function playerInsights(p) {
  const I = STR[state.lang].ins;
  const all = activePlayersRaw();
  const qual = all.filter((x) => x.gp >= 3);
  const pos = qual.filter((x) => x.position === p.position);
  const col = (arr, f) => arr.map(f);
  const out = [];

  const scQ = _pctl(p.avg_points, col(qual, (x) => x.avg_points));
  if (scQ >= 88) out.push([9, I.p_scoreElite(fmt(p.avg_points), scQ)]);
  else if (scQ >= 70) out.push([5, I.p_scoreHigh(fmt(p.avg_points), scQ)]);
  else if (scQ <= 22) out.push([3, I.p_scoreLow(fmt(p.avg_points))]);

  if (p.ts_pct > 0) {
    const tsPool = col(qual.filter((x) => x.ts_pct > 0), (x) => x.ts_pct);
    const tsQ = _pctl(p.ts_pct, tsPool);
    if (tsQ >= 82) out.push([8, I.p_tsElite(fmt(p.ts_pct), tsQ)]);
    else if (tsQ <= 20) out.push([7, I.p_tsLow(fmt(p.ts_pct), tsQ)]);
  }
  if (p.bad_split) out.push([6, I.p_badSplit]);

  const asQ = _pctl(p.avg_assists, col(qual, (x) => x.avg_assists));
  if (p.ast_to_tov >= 2 && asQ >= 55) out.push([6, I.p_playmaker(fmt(p.ast_to_tov, 2), fmt(p.avg_assists))]);
  else if (p.ast_to_tov > 0 && p.ast_to_tov < 1 && p.avg_assists >= 1.5) out.push([5, I.p_tovProne(fmt(p.ast_to_tov, 2))]);

  if (pos.length >= 4) {
    const rbQ = _pctl(p.avg_rebounds, col(pos, (x) => x.avg_rebounds));
    if (rbQ >= 80) out.push([6, I.p_rebStrong(fmt(p.avg_rebounds), positionFull(p.position), rbQ)]);
    else if (rbQ <= 18) out.push([3, I.p_rebWeak(fmt(p.avg_rebounds), positionFull(p.position))]);
  }

  if (p.fg3_pct >= 36) {
    const t3Pool = col(qual.filter((x) => x.fg3_pct > 0), (x) => x.fg3_pct);
    const t3Q = _pctl(p.fg3_pct, t3Pool);
    if (t3Q >= 75) out.push([5, I.p_three(fmt(p.fg3_pct), t3Q)]);
  }

  if (p.pir_rank_league && p.pir_rank_league <= Math.max(3, Math.round(qual.length * 0.08)))
    out.push([10, I.p_pirTop(p.pir_rank_league, fmt(p.avg_pir))]);

  return _pick(out, I.p_balanced);
}

function teamInsights(tm) {
  const I = STR[state.lang].ins;
  const teams = activeTeams();
  const col = (f) => teams.map(f);
  const out = [];

  if (tm.rank === 1) out.push([9, I.t_rankTop(fmt(tm.avg_pir))]);
  else if (tm.rank <= Math.ceil(teams.length / 3)) out.push([5, I.t_rankHigh(tm.rank)]);
  else if (tm.rank > teams.length - Math.ceil(teams.length / 3)) out.push([5, I.t_rankLow(tm.rank, teams.length)]);

  const offQ = _pctl(tm.avg_points, col((x) => x.avg_points));
  if (offQ >= 85) out.push([8, I.t_offElite(fmt(tm.avg_points), offQ)]);
  else if (offQ <= 20) out.push([7, I.t_offLow(fmt(tm.avg_points), offQ)]);

  const asQ = _pctl(tm.avg_assists, col((x) => x.avg_assists));
  if (asQ >= 82) out.push([6, I.t_ballMove(fmt(tm.avg_assists), asQ)]);

  const tovQ = _pctl(tm.avg_turnovers, col((x) => x.avg_turnovers), true); // lower is better
  if (tovQ >= 82) out.push([6, I.t_tovLow(fmt(tm.avg_turnovers))]);

  const rbQ = _pctl(tm.avg_rebounds, col((x) => x.avg_rebounds));
  if (rbQ >= 82) out.push([5, I.t_reb(fmt(tm.avg_rebounds), rbQ)]);

  const t3Q = _pctl(tm.fg3_pct, col((x) => x.fg3_pct));
  if (t3Q >= 82) out.push([5, I.t_three(fmt(tm.fg3_pct), t3Q)]);

  const blkQ = _pctl(tm.avg_blocks, col((x) => x.avg_blocks));
  if (blkQ >= 85) out.push([5, I.t_blocks(fmt(tm.avg_blocks), blkQ)]);

  return _pick(out, I.t_balanced);
}

function _pick(scored, fallback) {
  const lines = scored.sort((a, b) => b[0] - a[0]).slice(0, 4).map((x) => x[1]);
  if (lines.length < 2) lines.push(fallback);
  return lines;
}

function seasonHasPlayoffs(blob) {

function syncSeasonQueryParam(season) {

function setSeason(season) {
  if (!RAW.seasons || season === state.season || !RAW.seasons[season]) return;

function sortRows(rows, columns, sortKey, sortDir) {
  const col = columns.find((c) => c.key === sortKey);
  if (!col) return rows;
  const locale = state.lang === 'he' ? 'he' : 'en';
  return [...rows].sort((a, b) => {
    const av = col.get(a), bv = col.get(b);
    let cmp;
    if (col.text) cmp = String(av).localeCompare(String(bv), locale);
    else cmp = (av === null || av === undefined ? -Infinity : av) - (bv === null || bv === undefined ? -Infinity : bv);
    return sortDir === 'asc' ? cmp : -cmp;
  });
}
function toggleSort(keyField, dirField, columns, clickedKey) {
  const col = columns.find((c) => c.key === clickedKey);
  if (state[keyField] === clickedKey) {
    state[dirField] = state[dirField] === 'asc' ? 'desc' : 'asc';
  } else {
    state[keyField] = clickedKey;
    state[dirField] = col.text ? 'asc' : 'desc';
  }
  render();
}
function buildSortableHead(columns, colsClass, keyField, dirField, onSort) {
  const head = el('div', 'grid-head ' + colsClass);

    const btn = el('button', 'sort-head' + (col.right ? ' cell-right' : '') + (active ? ' active' : ''), label);
    btn.type = 'button';
    if (col.accent) btn.style.color = 'var(--accent)';
    btn.addEventListener('click', () => onSort(col.key));
    head.appendChild(btn);
  });
  return head;
}
function filterRows(rows, query, getText) {
  const q = query.trim().toLowerCase();
  if (!q) return rows;
  return rows.filter((row) => getText(row).toLowerCase().includes(q));
}
/* Each keystroke re-runs render(), which rebuilds the whole view subtree --
   so the <input> the user is typing in is destroyed and recreated. Stash the
   caret position here on input; render() reads it back and restores focus to
   the fresh .search-input so typing is never interrupted. Only ever set for
   the single render() call triggered by the keystroke itself. */
let searchFocus = null;

function buildSearchToolbar(query, placeholder, onInput, onExport) {
  const toolbar = el('div', 'table-toolbar');
  const input = document.createElement('input');
  input.type = 'search';
  input.className = 'search-input';
  input.placeholder = placeholder;
  input.value = query;
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.addEventListener('input', (e) => {
    searchFocus = { start: e.target.selectionStart, end: e.target.selectionEnd };
    onInput(e.target.value);
  });
  toolbar.appendChild(input);
  if (onExport) {
    const btn = el('button', 'export-btn', t('btn_export'));
    btn.type = 'button';
    btn.addEventListener('click', onExport);
    toolbar.appendChild(btn);
  }
  return toolbar;
}

/** Build an RFC-4180-ish CSV string and hand the browser a download. A
 * leading UTF-8 BOM keeps Hebrew readable when the file is opened in Excel.
 * (Works when dashboard.html is opened as a local file; a sandboxed artifact
 * iframe blocks script-triggered downloads.) */
function downloadCSV(filename, headers, rows) {
  const esc = (v) => {
    const s = v === null || v === undefined ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const body = [headers, ...rows].map((r) => r.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + body], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

/** A stat-table cell whose background is tinted by `value`'s percentile
 * within `pool` (always the FULL active team/roster, never the
 * search-filtered subset -- a tint should reflect true league-wide standing
 * even mid-search). `invert` for "lower is better" stats (turnovers). */
function buildStatCell(cls, value, pool, invert) {
  const cell = el('span', cls + ' pct-cell cell-right', fmt(value));
  cell.style.background = percentileBg(value, pool, invert);
  return cell;
}

  sub.style.cssText = 'font:400 13px/1.5 var(--font-body);color:var(--ink-3);margin:8px 0 30px;max-width:560px';
  root.appendChild(sub);

  // percentile pools: always the full active team set, never the
  // search-filtered subset, so tints reflect true league-wide standing
  const pools = {
    avg_points: teams.map((tm) => tm.avg_points),
    avg_assists: teams.map((tm) => tm.avg_assists),
    avg_rebounds: teams.map((tm) => tm.avg_rebounds),
    avg_blocks: teams.map((tm) => tm.avg_blocks),
    avg_turnovers: teams.map((tm) => tm.avg_turnovers),
    avg_pir: teams.map((tm) => tm.avg_pir),
  };

  const filtered = filterRows(teams, state.leagueQuery, teamHay);
  const sorted = state.leagueSortKey
    ? sortRows(filtered, LEAGUE_COLUMNS, state.leagueSortKey, state.leagueSortDir)
    : filtered;

  const exportLeague = () => downloadCSV('league_stats.csv',
    ['#', t('col_team'), 'PTS', 'AST', 'REB', 'BLK', 'TOV', 'PIR'],
    sorted.map((tm) => [tm.rank, teamLabel(tm),
      fmt(tm.avg_points), fmt(tm.avg_assists), fmt(tm.avg_rebounds),
      fmt(tm.avg_blocks), fmt(tm.avg_turnovers), fmt(tm.avg_pir)]));

  root.appendChild(buildSearchToolbar(state.leagueQuery, t('search_teams'), (v) => {
    state.leagueQuery = v; render();
  }, exportLeague));

  const panel = el('div', 'panel');
  if (sorted.length === 0) {
    panel.appendChild(el('div', 'empty-state', t('no_results')));
    root.appendChild(panel);
    return;
  }
  const wrap = el('div', 'table-wrap');
  wrap.appendChild(buildSortableHead(LEAGUE_COLUMNS, 'league-cols', 'leagueSortKey', 'leagueSortDir',
    (key) => toggleSort('leagueSortKey', 'leagueSortDir', LEAGUE_COLUMNS, key)));
  sorted.forEach((t) => {
    const row = el('button', 'grid-row league-cols');
    row.type = 'button';
    row.addEventListener('click', () => goTeam(t.id));
    row.appendChild(el('span', 'rank-num', String(t.rank)));
    row.appendChild(el('span', 'team-name-cell', teamLabel(t)));
    row.appendChild(buildStatCell('stat-strong', t.avg_points, pools.avg_points));
    row.appendChild(buildStatCell('stat-soft', t.avg_assists, pools.avg_assists));
    row.appendChild(buildStatCell('stat-soft', t.avg_rebounds, pools.avg_rebounds));
    row.appendChild(buildStatCell('stat-soft', t.avg_blocks, pools.avg_blocks));
    row.appendChild(buildStatCell('stat-soft', t.avg_turnovers, pools.avg_turnovers, true));
    row.appendChild(buildStatCell('pir-cell', t.avg_pir, pools.avg_pir));
    wrap.appendChild(row);
  });
  panel.appendChild(wrap);
  root.appendChild(panel);
}

/* ---------------- Team ---------------- */
function renderTeam(root) {
  const teams = activeTeams();
  const t = getTeam(state.teamId);
  const roster = getTeamRoster(t.id).sort((a, b) => b.avg_pir - a.avg_pir);

  const picker = el('div', 'player-picker');
  picker.appendChild(el('label', null, STR[state.lang].team_picker_label));
  const select = document.createElement('select');
  [...teams].sort((a, b) => a.rank - b.rank).forEach((team) => {
    const opt = document.createElement('option');
    opt.value = team.id;
    opt.textContent = STR[state.lang].team_picker_opt(team);
    if (team.id === t.id) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener('change', (e) => goTeam(e.target.value));
  picker.appendChild(select);
  root.appendChild(picker);

  const hero = el('div', 'panel team-hero');
  hero.appendChild(Object.assign(el('div'), { className: 'ring ring-accent' }));
  hero.appendChild(Object.assign(el('div'), { className: 'ring ring-soft' }));
  hero.appendChild(el('div', 'edge-accent'));
  const inner = el('div', 'team-hero-inner');
  const left = el('div');
  left.appendChild(el('div', 'eyebrow', STR[state.lang].team_eyebrow(t.rank, teams.length)));
  const titleWrap = el('div', 'team-hero-title');
  titleWrap.appendChild(document.createTextNode(teamName(t)));
  titleWrap.appendChild(document.createElement('br'));
  titleWrap.appendChild(el('span', 'display-outline', teamCity(t)));
  left.appendChild(titleWrap);
  inner.appendChild(left);

  const quad = el('div', 'team-quad');
  [
    ['avg_points', STR[state.lang].lbl_points], ['avg_assists', STR[state.lang].lbl_assists], ['avg_rebounds', STR[state.lang].lbl_rebounds],
    ['avg_blocks', STR[state.lang].lbl_blocks], ['avg_turnovers', STR[state.lang].lbl_turnovers], ['avg_pir', STR[state.lang].lbl_team_pir],
  ].forEach(([key, lbl]) => {
    const box = el('div');
    const num = el('div', 'num' + (key === 'avg_pir' ? ' hi' : ''), fmt(t[key]));
    box.appendChild(num);
    box.appendChild(el('div', 'lbl', lbl));
    quad.appendChild(box);
  });
  inner.appendChild(quad);
  hero.appendChild(inner);
  root.appendChild(hero);

  root.appendChild(insightsCard(teamInsights(t)));

  const rosterPanel = el('div', 'panel');
  const rh = el('div', 'panel-head');
  rh.style.display = 'flex'; rh.style.alignItems = 'baseline'; rh.style.justifyContent = 'space-between';
  rh.appendChild(el('div', 'panel-title sm', STR[state.lang].roster_title));
  rh.appendChild(el('div', null, STR[state.lang].roster_sub(roster.length)));
  rh.lastChild.style.cssText = 'font:400 11.5px/1 var(--font-body);color:var(--ink-3)';
  rosterPanel.appendChild(rh);

  const modeRow = el('div', 'stat-mode-row');
  modeRow.appendChild(el('label', null, STR[state.lang].stat_mode_label));
  const modeSwitch = el('div', 'lang-switch');
  [['totals', STR[state.lang].stat_mode_totals], ['per_game', STR[state.lang].stat_mode_per_game], ['per_36', STR[state.lang].stat_mode_per_36]]
    .forEach(([mode, label]) => {
      const btn = el('button', null, label);
      btn.type = 'button';
      btn.setAttribute('aria-pressed', state.statMode === mode ? 'true' : 'false');
      btn.addEventListener('click', () => { state.statMode = mode; render(); });
      modeSwitch.appendChild(btn);
    });
  modeRow.appendChild(modeSwitch);
  rosterPanel.appendChild(modeRow);

  const filteredRoster = filterRows(roster, state.rosterQuery, playerHay);
  const sortedRoster = state.rosterSortKey
    ? sortRows(filteredRoster, ROSTER_COLUMNS, state.rosterSortKey, state.rosterSortDir)
    : filteredRoster;

  // CSV of exactly what's on screen: filtered + sorted rows, columns and
  // values following the active Totals / Per Game / Per 36 mode.
  const exportRoster = () => {
    const sfx = modeSuffix();
    const d = state.statMode === 'totals' ? 0 : 1;
    const S = STR[state.lang];  // `t` is shadowed by the team object in renderTeam
    downloadCSV('team_roster_stats.csv',
      ['#', S.col_player, S.col_pos, S.col_age, S.col_ht, 'GP',
       'PTS' + sfx, 'AST' + sfx, 'REB' + sfx, 'PIR' + sfx],
      sortedRoster.map((p) => [
        jerseyLabel(p.jersey), playerName(p), posLabel(p.position),
        p.age !== null ? p.age : '', fmt(p.height_m, 2), p.gp,
        fmt(statValue(p, 'pts', 'avg_points', 'per_36_points'), d),
        fmt(statValue(p, 'ast', 'avg_assists', 'per_36_assists'), d),
        fmt(statValue(p, 'reb', 'avg_rebounds', 'per_36_rebounds'), d),
        fmt(statValue(p, 'pir', 'avg_pir', 'per_36_pir'), d),
      ]));
  };

  rosterPanel.appendChild(buildSearchToolbar(state.rosterQuery, STR[state.lang].search_players, (v) => {
    state.rosterQuery = v; render();
  }, exportRoster));

  // percentile pools: always the full roster, never the search-filtered subset
  const rosterPools = {
    avg_points: roster.map((p) => statValue(p, 'pts', 'avg_points', 'per_36_points')),
    avg_assists: roster.map((p) => statValue(p, 'ast', 'avg_assists', 'per_36_assists')),
    avg_rebounds: roster.map((p) => statValue(p, 'reb', 'avg_rebounds', 'per_36_rebounds')),
    avg_pir: roster.map((p) => statValue(p, 'pir', 'avg_pir', 'per_36_pir')),
  };

  if (sortedRoster.length === 0) {
    rosterPanel.appendChild(el('div', 'empty-state', STR[state.lang].no_players_match));
    root.appendChild(rosterPanel);
    return;
  }

  const wrap = el('div', 'table-wrap');
  wrap.appendChild(buildSortableHead(ROSTER_COLUMNS, 'roster-cols', 'rosterSortKey', 'rosterSortDir',
    (key) => toggleSort('rosterSortKey', 'rosterSortDir', ROSTER_COLUMNS, key)));
  sortedRoster.forEach((p) => {
    const row = el('button', 'grid-row roster-cols');
    row.type = 'button';
    row.addEventListener('click', () => goPlayer(p.id));
    row.appendChild(el('span', 'rank-num sm', jerseyLabel(p.jersey)));
    const nameCell = el('span', 'player-name-cell');
    if (p.bad_split) nameCell.appendChild(el('span', 'row-flag'));
    nameCell.appendChild(document.createTextNode(playerName(p)));
    if (isMultiStint(p)) nameCell.appendChild(el('span', 'stint-star', '*'));
    row.appendChild(nameCell);
    row.appendChild(el('span', 'pos-cell', posLabel(p.position)));
    row.appendChild(el('span', 'stat-soft sm cell-right', p.age !== null ? String(p.age) : '—'));
    row.appendChild(el('span', 'stat-soft sm cell-right', fmt(p.height_m, 2)));
    row.appendChild(el('span', 'stat-soft sm cell-right', String(p.gp)));
    row.appendChild(buildStatCell('stat-strong sm', statValue(p, 'pts', 'avg_points', 'per_36_points'), rosterPools.avg_points));
    row.appendChild(buildStatCell('stat-soft sm', statValue(p, 'ast', 'avg_assists', 'per_36_assists'), rosterPools.avg_assists));
    row.appendChild(buildStatCell('stat-soft sm', statValue(p, 'reb', 'avg_rebounds', 'per_36_rebounds'), rosterPools.avg_rebounds));
    row.appendChild(buildStatCell('pir-cell sm', statValue(p, 'pir', 'avg_pir', 'per_36_pir'), rosterPools.avg_pir));
    wrap.appendChild(row);
  });
  rosterPanel.appendChild(wrap);
  const flagged = roster.filter(p => p.bad_split).length;
  if (flagged > 0) {
    const note = el('div', 'team-note');
    note.appendChild(document.createTextNode(STR[state.lang].roster_flag_note(flagged)));
    rosterPanel.appendChild(note);
  }
  // NB: `t` is the team object in this function, not the i18n helper -- use STR.
  if (roster.some(isMultiStint)) rosterPanel.appendChild(el('div', 'team-note', STR[state.lang].stint_note));
  root.appendChild(rosterPanel);
}

/* ---------------- Player ---------------- */
/* The Player tab has two views: the league-wide filterable/sortable table
   (default, `list`) and one player's full card (`detail`, reached by clicking
   a row anywhere). */
function renderPlayer(root) {
  if (state.playerView === 'detail') renderPlayerCard(root);
  else renderPlayerList(root);
}

function renderPlayerList(root) {
  root.appendChild(el('div', 'eyebrow', t('players_eyebrow')));
  root.appendChild(el('div', 'display-xl', t('players_title')));
  const sub = el('div', null, t('players_sub')(activePlayersRaw().length));
  sub.style.cssText = 'font:400 13px/1.5 var(--font-body);color:var(--ink-3);margin:8px 0 26px';
  root.appendChild(sub);

  const filters = el('div', 'players-filters');

  const search = document.createElement('input');
  search.type = 'search';
  search.className = 'search-input';
  search.placeholder = t('search_players');
  search.value = state.playersQuery;
  search.autocomplete = 'off';
  search.spellcheck = false;
  search.addEventListener('input', (e) => {
    searchFocus = { start: e.target.selectionStart, end: e.target.selectionEnd };
    state.playersQuery = e.target.value;
    render();
  });
  filters.appendChild(search);

  const present = new Set();
  activePlayersRaw().forEach((p) => posGroups(p.position).forEach((g) => present.add(g)));
  const posSel = document.createElement('select');
  posSel.appendChild(new Option(t('filter_pos_all'), ''));
  POS_SLOTS.filter((pp) => present.has(pp)).forEach((pp) => posSel.appendChild(new Option(pp, pp)));
  posSel.value = state.playersPos;
  posSel.addEventListener('change', (e) => { state.playersPos = e.target.value; render(); });
  filters.appendChild(posSel);

  const teamSel = document.createElement('select');
  teamSel.appendChild(new Option(t('filter_team_all'), ''));
  [...activeTeams()].sort((a, b) => a.rank - b.rank).forEach((tm) => teamSel.appendChild(new Option(teamLabel(tm), tm.id)));
  teamSel.value = state.playersTeam;
  teamSel.addEventListener('change', (e) => { state.playersTeam = e.target.value; render(); });
  filters.appendChild(teamSel);

  const modeSwitch = el('div', 'lang-switch');
  [['totals', t('stat_mode_totals')], ['per_game', t('stat_mode_per_game')], ['per_36', t('stat_mode_per_36')]]
    .forEach(([m, lbl]) => {
      const b = el('button', null, lbl);
      b.type = 'button';
      b.setAttribute('aria-pressed', state.statMode === m ? 'true' : 'false');
      b.addEventListener('click', () => { state.statMode = m; render(); });
      modeSwitch.appendChild(b);
    });
  filters.appendChild(modeSwitch);
  root.appendChild(filters);

  let rows = activePlayersRaw().slice();
  if (state.playersTeam) rows = rows.filter((p) => p.team_id === state.playersTeam);
  if (state.playersPos) rows = rows.filter((p) => posGroups(p.position).includes(state.playersPos));
  rows = filterRows(rows, state.playersQuery, playerHay);
  rows = sortRows(rows, PLAYERS_COLUMNS, state.playersSortKey, state.playersSortDir);

  const panel = el('div', 'panel');
  if (!rows.length) {
    panel.appendChild(el('div', 'empty-state', t('no_players_match')));
    root.appendChild(panel);
    return;
  }
  const wrap = el('div', 'table-wrap');
  wrap.appendChild(buildSortableHead(PLAYERS_COLUMNS, 'players-cols', 'playersSortKey', 'playersSortDir',
    (key) => toggleSort('playersSortKey', 'playersSortDir', PLAYERS_COLUMNS, key)));
  const dec = state.statMode === 'totals' ? 0 : 1;
  rows.forEach((p) => {
    const row = el('button', 'grid-row players-cols');
    row.type = 'button';
    row.addEventListener('click', () => goPlayer(p.id));
    const nameCell = el('span', 'player-name-cell');
    if (p.bad_split) nameCell.appendChild(el('span', 'row-flag'));
    nameCell.appendChild(document.createTextNode(playerName(p)));
    if (isMultiStint(p)) nameCell.appendChild(el('span', 'stint-star', '*'));
    row.appendChild(nameCell);
    row.appendChild(el('span', 'stat-soft sm ellip', teamLabel(getTeam(p.team_id))));
    row.appendChild(el('span', 'pos-cell', posLabel(p.position)));
    row.appendChild(el('span', 'stat-soft sm cell-right', p.age !== null ? String(p.age) : '—'));
    row.appendChild(el('span', 'stat-soft sm cell-right', String(p.gp)));
    row.appendChild(el('span', 'stat-soft sm cell-right', state.statMode === 'totals' ? String(Math.round(p.avg_minutes * p.gp)) : fmt(p.avg_minutes, 1)));
    row.appendChild(el('span', 'stat-strong sm cell-right', fmt(statValue(p, 'pts', 'avg_points', 'per_36_points'), dec)));
    row.appendChild(el('span', 'stat-soft sm cell-right', fmt(statValue(p, 'reb', 'avg_rebounds', 'per_36_rebounds'), dec)));
    row.appendChild(el('span', 'stat-soft sm cell-right', fmt(statValue(p, 'ast', 'avg_assists', 'per_36_assists'), dec)));
    row.appendChild(el('span', 'pir-cell sm cell-right', fmt(statValue(p, 'pir', 'avg_pir', 'per_36_pir'), dec)));
    row.appendChild(el('span', 'stat-soft sm cell-right', fmt(p.fg_pct, 1)));
    row.appendChild(el('span', 'stat-soft sm cell-right', fmt(p.fg3_pct, 1)));
    row.appendChild(el('span', 'stat-soft sm cell-right', fmt(p.ts_pct, 1)));
    wrap.appendChild(row);
  });
  panel.appendChild(wrap);
  if (rows.some(isMultiStint)) panel.appendChild(el('div', 'team-note', t('stint_note')));
  root.appendChild(panel);
}

function renderPlayerCard(root) {
  const players = activePlayersRaw();
  const teams = activeTeams();
  const p = players.find(x => x.id === state.playerId) || getAllPlayers()[0];
  const team = getTeam(p.team_id);
  const roster = getTeamRoster(team.id).sort((a, b) => b.avg_pir - a.avg_pir);
  const displayName = playerName(p);
  const nameParts = displayName.split(' ');
  const firstName = nameParts[0];
  const restName = nameParts.slice(1).join(' ');

  const back = el('button', 'back-link', (state.lang === 'he' ? '→ ' : '← ') + t('players_all'));
  back.type = 'button';
  back.addEventListener('click', () => { state.playerView = 'list'; render(); window.scrollTo({ top: 0 }); });
  root.appendChild(back);

  const picker = el('div', 'player-picker');
  picker.appendChild(el('label', null, STR[state.lang].player_picker_viewing));
  const teamSelect = document.createElement('select');
  [...teams].sort((a, b) => a.rank - b.rank).forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = teamLabel(t);
    if (t.id === team.id) opt.selected = true;
    teamSelect.appendChild(opt);
  });
  teamSelect.addEventListener('change', (e) => {
    const r = getTeamRoster(e.target.value).sort((a, b) => b.avg_pir - a.avg_pir);
    if (r.length) goPlayer(r[0].id);
  });
  picker.appendChild(teamSelect);
  const select = document.createElement('select');
  roster.forEach((rp) => {
    const opt = document.createElement('option');
    opt.value = String(rp.id);
    opt.textContent = jerseyLabel(rp.jersey) + ' ' + playerName(rp);
    if (rp.id === p.id) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener('change', (e) => goPlayer(Number(e.target.value)));
  picker.appendChild(select);
  root.appendChild(picker);

  const card = el('div', 'panel');
  const hero = el('div', 'player-hero');
  hero.appendChild(Object.assign(el('div'), { className: 'ring ring-accent' }));
  hero.appendChild(Object.assign(el('div'), { className: 'ring ring-soft' }));
  hero.appendChild(el('div', 'edge-accent'));
  const inner = el('div', 'player-hero-inner');
  const left = el('div');
  left.appendChild(el('div', 'eyebrow', STR[state.lang].player_eyebrow(teamLabel(team), positionFull(p.position), p.jersey)));
  const nameEl = el('div', 'player-name');
  nameEl.appendChild(document.createTextNode(firstName));
  if (restName) {
    nameEl.appendChild(document.createElement('br'));
    nameEl.appendChild(el('span', 'display-outline', restName));
  }
  left.appendChild(nameEl);
  if (p.position) left.appendChild(el('div', 'player-pos', positionFull(p.position)));
  inner.appendChild(left);
  const badge = el('div', 'rank-badge');
  badge.appendChild(el('div', 'big', p.pir_rank_league !== null ? String(p.pir_rank_league) : '—'));
  badge.appendChild(el('div', 'lbl', STR[state.lang].player_rank_badge(players.length)));
  inner.appendChild(badge);
  hero.appendChild(inner);
  card.appendChild(hero);

  const quad = el('div', 'quad4');
  [
    ['avg_points', STR[state.lang].lbl_points], ['avg_assists', STR[state.lang].lbl_assists], ['avg_rebounds', STR[state.lang].lbl_rebounds], ['avg_pir', STR[state.lang].lbl_pir, true],
  ].forEach(([key, lbl, hi]) => {
    const box = el('div');
    box.appendChild(el('div', 'num' + (hi ? ' hi' : ''), fmt(p[key])));
    box.appendChild(el('div', 'lbl', lbl));
    quad.appendChild(box);
  });
  card.appendChild(quad);

  const bioCell = (lbl, val) => {
    const box = el('div');
    box.appendChild(el('div', 'section-lbl', lbl));
    const num = el('div', 'num');
    if (typeof val === 'string') num.textContent = val; else num.appendChild(val);
    box.appendChild(num);
    return box;
  };

  const lower = el('div', 'player-lower');

  /* left column: everything about how the season went -- shooting + playing load */
  const shootCol = el('div');
  shootCol.style.display = 'flex'; shootCol.style.flexDirection = 'column'; shootCol.style.gap = '13px';
  shootCol.appendChild(el('div', 'section-lbl', STR[state.lang].section_shooting));
  [
    ['FG%', p.fg_pct, false], ['3PT%', p.fg3_pct, true], ['FT%', p.ft_pct, false],
  ].forEach(([k, v, accent]) => {
    const line = el('div', 'bar-line');
    line.appendChild(el('span', 'k', k));
    const track = el('span', 'tr');
    const fill = el('span', 'fl' + (accent ? '' : ' white'));
    fill.style.width = pct(v) + '%';
    track.appendChild(fill);
    line.appendChild(track);
    line.appendChild(el('span', 'v', fmt(v)));
    shootCol.appendChild(line);
  });
  if (p.bad_split) {
    const banner = el('div', 'flag-banner');
    banner.appendChild(document.createTextNode('⚠️ '));
    const b = el('b', null, STR[state.lang].flag_banner(fmt(p.efg_pct), fmt(p.ts_pct), p.fg3_pct));
    banner.appendChild(b);
    shootCol.appendChild(banner);
  }
  const usageLbl = el('div', 'section-lbl', STR[state.lang].section_usage);
  usageLbl.style.cssText = 'margin-top:9px;padding-top:20px;border-top:1px solid var(--hair)';
  shootCol.appendChild(usageLbl);
  const usage = el('div', 'bio-grid cols-2');
  [
    bioCell(STR[state.lang].bio_games, String(p.gp)),
    bioCell(STR[state.lang].bio_minutes, fmt(p.avg_minutes)),
  ].forEach((box) => usage.appendChild(box));
  shootCol.appendChild(usage);
  lower.appendChild(shootCol);

  /* right column: who the player is -- fixed personal details only */
  const nat = nationalityDisplay(p.nationality);
  const natVal = el('span');
  if (nat.cc && FLAGS[nat.cc]) { const f = el('span', 'flag-ico'); f.innerHTML = FLAGS[nat.cc]; natVal.appendChild(f); }
  natVal.appendChild(document.createTextNode(nat.text));

  const bioCol = el('div');
  bioCol.appendChild(el('div', 'section-lbl', STR[state.lang].section_bio));
  const bio = el('div', 'bio-grid cols-2');
  bio.style.marginTop = '13px';
  [
    bioCell(STR[state.lang].bio_age, p.age !== null ? String(p.age) : '—'),
    bioCell(STR[state.lang].bio_height, fmt(p.height_m, 2) + 'm'),
    bioCell(STR[state.lang].bio_nationality, natVal),
    bioCell(STR[state.lang].bio_on_team, p.years_on_team !== null ? STR[state.lang].yr(p.years_on_team) : '—'),
  ].forEach((box) => bio.appendChild(box));
  bioCol.appendChild(bio);
  lower.appendChild(bioCol);
  card.appendChild(lower);
  root.appendChild(card);

  /* ---- stats by season (NBA-style splits) ----
     Headline numbers above are the season-total "general" line; this panel
     lets you pick a calculation mode (totals / per game / per 36) and a
     split (regular season / playoffs) and reads it back one row per season.
     Only 2023-24 exists today -- `seasonRows` is the single place to extend
     once more seasons are ingested. */
  const seasonPanel = el('div', 'panel');
  seasonPanel.style.marginTop = '24px';
  const sh = el('div', 'panel-head');
  sh.appendChild(el('div', 'panel-kicker', STR[state.lang].pl_season_kicker));
  sh.appendChild(el('div', 'panel-title sm', STR[state.lang].pl_season_title));
  seasonPanel.appendChild(sh);

  const ctrlRow = el('div', 'stat-mode-row');
  ctrlRow.style.paddingTop = '16px';
  ctrlRow.appendChild(el('label', null, STR[state.lang].pl_calc_label));
  const calcSwitch = el('div', 'lang-switch');

function wrapField(labelText, ctrl) {
  const f = el('div', 'sc-field');
  f.appendChild(el('label', null, labelText));
  f.appendChild(ctrl);
  return f;
}
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = s.length >> 1;
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function buildScatter(players) {
  const S = STR[state.lang];
  const NS = 'http://www.w3.org/2000/svg';
  const W = 760, H = 470, m = { l: 54, r: 20, t: 34, b: 48 };
  const pw = W - m.l - m.r, phv = H - m.t - m.b;
  const xs = players.map((p) => p.avg_points);
  const ys = players.map((p) => p.ts_pct);
  let xMin = Math.max(0, Math.min(...xs) - 2), xMax = Math.max(...xs) + 2;
  let yMin = Math.min(...ys) - 2, yMax = Math.max(...ys) + 2;
  if (xMax <= xMin) xMax = xMin + 1;
  if (yMax <= yMin) yMax = yMin + 1;
  const medX = median(xs), medY = median(ys);
  const sx = (v) => m.l + (v - xMin) / (xMax - xMin) * pw;
  const sy = (v) => m.t + phv - (v - yMin) / (yMax - yMin) * phv;
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  const wrap = el('div', 'sc-wrap');
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class', 'sc-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', S.sc_title);

  svg.appendChild(mk('line', { class: 'sc-axis', x1: m.l, y1: m.t + phv, x2: m.l + pw, y2: m.t + phv }));
  svg.appendChild(mk('line', { class: 'sc-axis', x1: m.l, y1: m.t, x2: m.l, y2: m.t + phv }));

  const N = 5;
  for (let i = 0; i <= N; i++) {
    const xv = xMin + (xMax - xMin) * i / N, xp = sx(xv);
    svg.appendChild(mk('line', { class: 'sc-axis', x1: xp, y1: m.t + phv, x2: xp, y2: m.t + phv + 4 }));
    const tx = mk('text', { class: 'sc-tick', x: xp, y: m.t + phv + 16, 'text-anchor': 'middle' });
    tx.textContent = xv.toFixed(0); svg.appendChild(tx);
    const yv = yMin + (yMax - yMin) * i / N, yp = sy(yv);
    svg.appendChild(mk('line', { class: 'sc-axis', x1: m.l - 4, y1: yp, x2: m.l, y2: yp }));
    const ty = mk('text', { class: 'sc-tick', x: m.l - 8, y: yp + 3, 'text-anchor': 'end' });
    ty.textContent = yv.toFixed(0); svg.appendChild(ty);
  }

  const xt = mk('text', { class: 'sc-axis-title', x: m.l + pw / 2, y: H - 8, 'text-anchor': 'middle' });
  xt.textContent = S.sc_x; svg.appendChild(xt);
  const yc = m.t + phv / 2;
  const yt = mk('text', { class: 'sc-axis-title', x: 14, y: yc, 'text-anchor': 'middle', transform: 'rotate(-90 14 ' + yc + ')' });
  yt.textContent = S.sc_y; svg.appendChild(yt);

  svg.appendChild(mk('line', { class: 'sc-quad', x1: sx(medX), y1: m.t, x2: sx(medX), y2: m.t + phv }));
  svg.appendChild(mk('line', { class: 'sc-quad', x1: m.l, y1: sy(medY), x2: m.l + pw, y2: sy(medY) }));

  const ql = (txt, x, y, anchor) => {
    const e = mk('text', { class: 'sc-quad-label', x, y, 'text-anchor': anchor });
    e.textContent = txt; svg.appendChild(e);
  };
  ql(S.sc_q_elite, m.l + pw - 4, m.t + 12, 'end');
  ql(S.sc_q_spec, m.l + 4, m.t + 12, 'start');
  ql(S.sc_q_ineff, m.l + pw - 4, m.t + phv - 6, 'end');
  ql(S.sc_q_limited, m.l + 4, m.t + phv - 6, 'start');

  const tip = el('div', 'sc-tooltip');
  const place = (ev) => {
    const r = wrap.getBoundingClientRect();
    let x = ev.clientX - r.left + 12;
    if (x + tip.offsetWidth + 8 > r.width) x = ev.clientX - r.left - 12 - tip.offsetWidth;
    tip.style.left = Math.max(0, x) + 'px';
    tip.style.top = (ev.clientY - r.top + 12) + 'px';
  };
  players.forEach((p) => {
    const c = mk('circle', { class: 'sc-dot', cx: sx(p.avg_points), cy: sy(p.ts_pct), r: 4.7 });
    c.addEventListener('mouseenter', () => {
      tip.textContent = '';
      const nm = el('div'); nm.style.cssText = 'font-weight:700;color:var(--accent)';
      nm.textContent = playerName(p); tip.appendChild(nm);
      tip.appendChild(el('div', null, teamLabel(getTeam(p.team_id))));
      tip.appendChild(el('div', null, S.sc_x + ': ' + fmt(p.avg_points) + '  ·  ' + S.sc_y + ': ' + fmt(p.ts_pct)));
      tip.style.display = 'block';
    });
    c.addEventListener('mousemove', place);
    c.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    svg.appendChild(c);
  });

  wrap.appendChild(svg);
  wrap.appendChild(tip);
  return wrap;
}

/* ---- B. head-to-head: two players or two teams ---- */
function renderH2HSection(root) {
  const S = STR[state.lang];
  const isTeams = state.analyticsView === 'teams';

  const panel = el('div', 'panel');
  const ph = el('div', 'panel-head');
  ph.appendChild(el('div', 'panel-kicker', S.an_sec_h2h));
  ph.appendChild(el('div', 'panel-title sm', S.h2h_title));

  const modeRow = el('div', 'an-toggle');
  modeRow.style.cssText = 'padding:16px 28px 0;margin:0';
  modeRow.appendChild(el('label', null, S.an_view_label));
  const modeSw = el('div', 'lang-switch');
  [['players', S.an_view_players], ['teams', S.an_view_teams]].forEach(([mode, label]) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.setAttribute('aria-pressed', state.analyticsView === mode ? 'true' : 'false');
    b.addEventListener('click', () => { state.analyticsView = mode; render(); });
    modeSw.appendChild(b);
  });
  modeRow.appendChild(modeSw);
  panel.appendChild(modeRow);

  const pool = isTeams
    ? [...activeTeams()].sort((a, b) => a.rank - b.rank)
    : [...activePlayersRaw()].sort((a, b) => playerName(a).localeCompare(playerName(b), state.lang === 'he' ? 'he' : 'en'));
  const idsKey = isTeams ? 'radarTeamIds' : 'cmpPlayerIds';
  const gid = (x) => String(x.id);
  const label = (x) => isTeams ? teamLabel(x) : (playerName(x) + ' — ' + teamLabel(getTeam(x.team_id)));

  const ids = (state[idsKey] || []).slice(0, 2);
  if (ids[0] == null && pool[0]) ids[0] = pool[0].id;
  if (ids[1] == null && pool[1]) ids[1] = pool[1].id;

  const pickRow = el('div', 'cmp-picker-row');
  [0, 1].forEach((slot) => {
    const s = el('div', 'cmp-picker-slot');
    const sw = el('span', 'cmp-picker-swatch'); sw.style.background = CMP_COLORS[slot];
    s.appendChild(sw);
    const sel = document.createElement('select');
    pool.forEach((x) => {
      const o = document.createElement('option');
      o.value = gid(x); o.textContent = label(x);
      if (String(ids[slot]) === gid(x)) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', (e) => {
      const arr = (state[idsKey] || []).slice();
      arr[slot] = isTeams ? e.target.value : Number(e.target.value);
      state[idsKey] = arr;
      render();
    });
    s.appendChild(sel);
    pickRow.appendChild(s);
  });
  panel.appendChild(pickRow);

  const find = (id) => pool.find((x) => gid(x) === String(id));
  const A = find(ids[0]), B = find(ids[1]);
  const body = el('div', 'cmp-chart');
  if (!A || !B || gid(A) === gid(B)) body.appendChild(el('div', 'empty-state', S.h2h_empty));
  else body.appendChild(buildH2H(A, B, isTeams));
  panel.appendChild(body);
  root.appendChild(panel);
}

function buildH2H(A, B, isTeams) {
  const cats = isTeams ? [
    ['avg_points', 'PTS', 1, true], ['avg_assists', 'AST', 1, true], ['avg_rebounds', 'REB', 1, true],
    ['avg_turnovers', 'TOV', 1, false], ['avg_blocks', 'BLK', 1, true], ['avg_pir', 'PIR', 1, true],
    ['fg3_pct', '3P%', 1, true],
  ] : [
    ['avg_points', 'PTS', 1, true], ['ts_pct', 'TS%', 1, true], ['avg_assists', 'AST', 1, true],
    ['avg_rebounds', 'REB', 1, true], ['avg_turnovers', 'TOV', 1, false], ['avg_pir', 'PIR', 1, true],
    ['efficiency', 'EFF', 0, true],
  ];
  const wrap = el('div', 'h2h-wrap');
  const legend = el('div', 'cmp-legend');
  [[A, CMP_COLORS[0]], [B, CMP_COLORS[1]]].forEach(([x, c]) => {
    const it = el('span');
    const i = document.createElement('i'); i.style.background = c; it.appendChild(i);
    it.appendChild(document.createTextNode(isTeams ? teamLabel(x) : playerName(x)));
    legend.appendChild(it);
  });
  wrap.appendChild(legend);

  cats.forEach(([key, lbl, dec, higherBetter]) => {
    const av = Number(A[key]) || 0, bv = Number(B[key]) || 0;
    const mx = Math.max(av, bv, 1e-6);
    const aWins = higherBetter ? av > bv : av < bv;
    const bWins = higherBetter ? bv > av : bv < av;
    const row = el('div', 'h2h-row');
    const aCell = el('div', 'h2h-val a' + (aWins ? ' h2h-win' : '')); aCell.textContent = fmt(av, dec);
    const bCell = el('div', 'h2h-val b' + (bWins ? ' h2h-win' : '')); bCell.textContent = fmt(bv, dec);
    const mid = el('div', 'h2h-mid');
    mid.appendChild(el('div', 'h2h-cat', lbl));
    const bars = el('div', 'h2h-bars');
    const aWrap = el('span', 'h2h-bar-wrap left');
    const aBar = el('span', 'h2h-bar');
    aBar.style.width = (av / mx * 100) + '%';
    aBar.style.background = aWins ? CMP_COLORS[0] : 'var(--hair-strong)';
    aWrap.appendChild(aBar);
    const bWrap = el('span', 'h2h-bar-wrap right');
    const bBar = el('span', 'h2h-bar');
    bBar.style.width = (bv / mx * 100) + '%';
    bBar.style.background = bWins ? CMP_COLORS[1] : 'var(--hair-strong)';
    bWrap.appendChild(bBar);
    bars.appendChild(aWrap); bars.appendChild(bWrap);
    mid.appendChild(bars);
    row.appendChild(aCell); row.appendChild(mid); row.appendChild(bCell);
    wrap.appendChild(row);
  });
  return wrap;
}

/* ---- C. multi-season league trends ---- */
function renderTrendsSection(root) {
  const S = STR[state.lang];
  const panel = el('div', 'panel');
  const ph = el('div', 'panel-head');
  ph.appendChild(el('div', 'panel-kicker', S.an_sec_trends));
  ph.appendChild(el('div', 'panel-title sm', S.tr_title));
  panel.appendChild(ph);

  const body = el('div', 'sc-body');
  const seasons = seasonList().slice().sort();
  if (seasons.length < 2) {
    body.appendChild(el('div', 'empty-state', S.sc_empty));
  } else {
    const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
    const series = seasons.map((sk) => {
      const blob = RAW.seasons[sk];
      const tms = blob.teams || [], pls = blob.players || [];
      const ftPool = pls.filter((p) => p.gp >= 5 && p.ft_pct > 0).map((p) => p.ft_pct);
      return {
        season: sk,
        pts: mean(tms.map((tm) => tm.avg_points)),
        fg3a: mean(tms.map((tm) => tm.avg_fg3a)),
        ft: mean(ftPool),
      };
    });
    body.appendChild(buildTrends(series));
  }
  panel.appendChild(body);
  root.appendChild(panel);
}

function buildTrends(series) {
  const S = STR[state.lang];
  const NS = 'http://www.w3.org/2000/svg';
  const metrics = [
    { key: 'fg3a', label: S.tr_3par, color: CMP_COLORS[0], dec: 1 },
    { key: 'pts', label: S.tr_pace, color: CMP_COLORS[1], dec: 1 },
    { key: 'ft', label: S.tr_ft, color: CMP_COLORS[2], dec: 1 },
  ];
  const wrap = el('div', 'sc-wrap');

  const legend = el('div', 'tr-legend');
  metrics.forEach((mt) => {
    const s = el('span');
    const i = el('i'); i.style.background = mt.color; s.appendChild(i);
    const v0 = series[0][mt.key], v1 = series[series.length - 1][mt.key];
    s.appendChild(document.createTextNode(mt.label + ':  ' + fmt(v0, mt.dec) + ' → ' + fmt(v1, mt.dec)));
    legend.appendChild(s);
  });
  wrap.appendChild(legend);

  const W = 780, H = 400, m = { l: 40, r: 24, t: 22, b: 46 };
  const pw = W - m.l - m.r, phv = H - m.t - m.b, n = series.length;
  const xAt = (i) => m.l + (n === 1 ? pw / 2 : pw * i / (n - 1));
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class', 'sc-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', S.tr_title);

  series.forEach((d, i) => {
    const x = xAt(i);
    svg.appendChild(mk('line', { class: 'sc-quad', x1: x, y1: m.t, x2: x, y2: m.t + phv, 'stroke-dasharray': '2 5' }));
    const tl = mk('text', { class: 'sc-tick', x, y: m.t + phv + 16, 'text-anchor': 'middle' });
    tl.textContent = d.season.split('-').map((y) => y.slice(2)).join('–');
    svg.appendChild(tl);
  });
  svg.appendChild(mk('line', { class: 'sc-axis', x1: m.l, y1: m.t + phv, x2: m.l + pw, y2: m.t + phv }));

  metrics.forEach((mt) => {
    const vals = series.map((d) => d[mt.key]);
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const yAt = (v) => m.t + phv - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * phv;
    const pts = series.map((d, i) => xAt(i) + ',' + yAt(d[mt.key])).join(' ');
    svg.appendChild(mk('polyline', { points: pts, fill: 'none', stroke: mt.color, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
    series.forEach((d, i) => svg.appendChild(mk('circle', { cx: xAt(i), cy: yAt(d[mt.key]), r: 3.5, fill: mt.color })));
  });

  const tip = el('div', 'sc-tooltip');
  series.forEach((d, i) => {
    const bl = i === 0 ? m.l : (xAt(i - 1) + xAt(i)) / 2;
    const br = i === n - 1 ? m.l + pw : (xAt(i) + xAt(i + 1)) / 2;
    const rect = mk('rect', { x: bl, y: m.t, width: Math.max(1, br - bl), height: phv, fill: 'transparent' });
    rect.style.cursor = 'crosshair';
    rect.addEventListener('mouseenter', () => {
      tip.textContent = '';
      const h = el('div'); h.style.cssText = 'font-weight:700;color:var(--accent)';
      h.textContent = d.season; tip.appendChild(h);
      metrics.forEach((mt) => tip.appendChild(el('div', null, mt.label + ': ' + fmt(d[mt.key], mt.dec))));
      tip.style.display = 'block';
    });
    rect.addEventListener('mousemove', (ev) => {
      const r = wrap.getBoundingClientRect();
      let x = ev.clientX - r.left + 12;
      if (x + tip.offsetWidth + 8 > r.width) x = ev.clientX - r.left - 12 - tip.offsetWidth;
      tip.style.left = Math.max(0, x) + 'px';
      tip.style.top = (ev.clientY - r.top + 12) + 'px';
    });
    rect.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    svg.appendChild(rect);
  });

  wrap.appendChild(svg);
  wrap.appendChild(tip);
  return wrap;
}


const RADAR_METRICS = [
  ['avg_points', 'lbl_points', false],
  ['avg_assists', 'lbl_assists', false],
  ['avg_rebounds', 'lbl_rebounds', false],
  ['avg_blocks', 'lbl_blocks', false],
  ['avg_turnovers', 'lbl_turnovers', true], // lower is better -- inverted so a bigger spike always means "better"
  ['avg_pir', 'lbl_team_pir', false],
];

/** 2-team radar (inspired by the project's original notebook, which compared
 * its top-2 teams by PIR the same way) -- min-max normalized per metric
 * across the full active team set, inline SVG, hand-rolled like every other
 * chart in this file. Colors are CMP_COLORS[0]/[1] (app accent + blue),
 * already validated (dataviz skill's validate_palette.js, --pairs all,
 * against this page's real dark surface). */
function buildTeamRadar(selectedTeams, allTeams) {
  const wrap = el('div', 'radar-wrap');

  const legend = el('div', 'cmp-legend');
  selectedTeams.forEach(({ team, color }) => {
    const item = el('span');
    const i = document.createElement('i');
    i.style.background = color;
    item.appendChild(i);
    const nameBtn = document.createElement('button');
    nameBtn.type = 'button';
    nameBtn.className = 'radar-legend-name';
    nameBtn.textContent = teamLabel(team);
    nameBtn.addEventListener('click', () => goTeam(team.id));
    item.appendChild(nameBtn);
    legend.appendChild(item);
  });
  wrap.appendChild(legend);

  const n = RADAR_METRICS.length;
  const ranges = RADAR_METRICS.map(([key]) => {
    const vals = allTeams.map((tm) => tm[key]);
    return [Math.min(...vals), Math.max(...vals)];
  });

  const NS = 'http://www.w3.org/2000/svg';
  const W = 460, H = 460, cx = W / 2, cy = H / 2, R = 155;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('class', 'radar-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', STR[state.lang].an_radar_title);

  const angleFor = (i) => -Math.PI / 2 + i * (2 * Math.PI / n);
  const pointFor = (i, frac) => {
    const a = angleFor(i);
    return [cx + Math.cos(a) * R * frac, cy + Math.sin(a) * R * frac];
  };

  [0.25, 0.5, 0.75, 1].forEach((frac) => {
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', RADAR_METRICS.map((_, i) => pointFor(i, frac).join(',')).join(' '));
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', 'var(--hair-strong)');
    poly.setAttribute('stroke-width', '1');
    svg.appendChild(poly);
  });

  RADAR_METRICS.forEach(([, labelKey], i) => {
    const [x1, y1] = pointFor(i, 1);
    const axisLine = document.createElementNS(NS, 'line');
    axisLine.setAttribute('x1', cx); axisLine.setAttribute('y1', cy);
    axisLine.setAttribute('x2', x1); axisLine.setAttribute('y2', y1);
    axisLine.setAttribute('stroke', 'var(--hair-strong)');
    axisLine.setAttribute('stroke-width', '1');
    svg.appendChild(axisLine);
    const [lx, ly] = pointFor(i, 1.2);
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', lx); label.setAttribute('y', ly);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('class', 'radar-axis-label');
    label.textContent = STR[state.lang][labelKey];
    svg.appendChild(label);
  });

  selectedTeams.forEach(({ team, color }, teamIdx) => {
    const coords = RADAR_METRICS.map(([key, , invert], i) => {
      const [min, max] = ranges[i];
      let frac = max > min ? (team[key] - min) / (max - min) : 0.5;
      if (invert) frac = 1 - frac;
      return pointFor(i, Math.max(0.04, frac));
    });
    const poly = document.createElementNS(NS, 'polygon');
    poly.setAttribute('points', coords.map((p) => p.join(',')).join(' '));
    poly.setAttribute('fill', color);
    poly.setAttribute('fill-opacity', '0.16');
    poly.setAttribute('stroke', color);
    poly.setAttribute('stroke-width', '2');
    svg.appendChild(poly);

    coords.forEach(([x, y], i) => {
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', '3.5');
      dot.setAttribute('fill', color);
      svg.appendChild(dot);

      // offset each team's value label by both angle AND radius so two
      // labels stay legibly apart even when both teams score nearly the
      // same on an axis (their vertices sit almost on top of each other)
      const labelAngle = angleFor(i) + (teamIdx === 0 ? -0.18 : 0.18);
      const labelDist = teamIdx === 0 ? 13 : 24;
      const lx = x + Math.cos(labelAngle) * labelDist;
      const ly = y + Math.sin(labelAngle) * labelDist;
      const val = document.createElementNS(NS, 'text');
      val.setAttribute('x', lx); val.setAttribute('y', ly);
      val.setAttribute('text-anchor', 'middle');
      val.setAttribute('class', 'radar-value-label');
      val.setAttribute('fill', color);
      val.textContent = fmt(team[RADAR_METRICS[i][0]]);
      svg.appendChild(val);
    });
  });

  wrap.appendChild(svg);
  return wrap;
}

/* ---------------- router ---------------- */
function render() {
  const refocus = searchFocus;
  searchFocus = null;
  syncTabs();
  const root = document.getElementById('view');
  root.innerHTML = '';
  if (state.tab === 'overview') renderOverview(root);
  else if (state.tab === 'league') renderLeague(root);
  else if (state.tab === 'team') renderTeam(root);
  else if (state.tab === 'player') renderPlayer(root);
  else if (state.tab === 'analytics') renderAnalytics(root);
  if (refocus) {
    const si = root.querySelector('.search-input');
    if (si) {
      si.focus({ preventScroll: true });
      try { si.setSelectionRange(refocus.start, refocus.end); } catch (e) {}
    }
  }
}
async function boot() {
  try {
    // Cache-bust so a redeploy of data.json is picked up immediately: a unique
    // query string sidesteps any stale disk/proxy copy, and `no-store` keeps
    // the browser from caching the response at all.
    const res = await fetch('./data.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    // Normalise to the season-keyed shape even for a legacy single-season file.
    RAW = (raw && raw.seasons)
      ? raw
      : { default_season: (raw && raw.season) || 'season', seasons: { [(raw && raw.season) || 'season']: raw } };

    // Resolve the active season: ?season= / localStorage (both in savedSeason) →
    // default_season → '2023-2024' → whatever's first.
    const fallback = RAW.seasons[RAW.default_season] ? RAW.default_season
      : (RAW.seasons['2023-2024'] ? '2023-2024' : Object.keys(RAW.seasons)[0]);
    state.season = (savedSeason && RAW.seasons[savedSeason]) ? savedSeason : fallback;
    DATA = RAW.seasons[state.season];

    // A stored 'playoffs' preference is meaningless for a season with no playoff data.
    if (state.competition === 'playoffs' && !seasonHasPlayoffs(DATA)) state.competition = 'regular_season';

    syncSeasonQueryParam(state.season);
    populateSeasonSelect();
    normalizeSelection();
  } catch (err) {
    const v = document.getElementById('view');
    if (v) v.innerHTML = '<div style="padding:2.5rem 1rem;text-align:center;color:var(--muted,#667);font:15px/1.5 system-ui,sans-serif">'
      + 'Could not load data.json &mdash; ' + String(err && err.message || err)
      + '<br>Serve this page over HTTP (not file://) so the browser can fetch it.</div>';
    return;
  }
  renderChrome();
  render();
}
boot();
